Immich:
  # The URL to your Immich API endpoint
  ApiUrl: http://localhost:2283/api

  # The API-key used to authenticate. The key can be created in Immich > Account Settings > API Keys
  ApiKey: <api key here>

  # Only report about planned changes without applying them
  DryRun: true

  # Log the list of skipped assets (used for validating regexes)
  LogSkipped: true

  # Log the list of updated assets
  LogUpdated: true

  # If you want to move the updated assets to a newly created album
  MoveToAlbum: true

  # The maximum number of assets to update in one run
  MaxUpdateCount: 5

  # Only updates assets within the specified date range (date format: YYYY-MM-DD)
  MinDate: 2025-01-01
  MaxDate: 2025-12-31

  # When true also updates assets that already have the same or an earlier date then what was parsed from the filename
  # One scenario this can be used for is when the dates are correct, but all timezones need to be adjusted
  SkipDateCheck: false

  # The timezone to apply to updated assets. Make sure you understand what you are doing when using this!
  # TimeZone: Europe/Berlin

  # A list of device id's to process, leave empty to include all assets
  # This is useful if you only want to process assets from a specific source/device (i.e. a phone)
  DeviceIds:
  #  - WEB
  #  - ece3bf929261ac26bc4d8e36f63956a43bc817ed2g4985a8b84de65e44caf5fa
  
  # A list of regex patterns used to parse the date and time from a filename.
  # The patterns are expected to have named capture groups:
  # Required: year, month, day
  # Optional: hour, minute, second.
  ParsePatterns:
    - IMG-(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d).*
    - VID-(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d).*
    - PXL_(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d)_(?<hour>\d\d)(?<minute>\d\d)(?<second>\d\d).*
    - WP_(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d).*
    - WP_(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d)_(?<hour>\d\d)_(?<minute>\d\d)_(?<second>\d\d).*
    - IMG_(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d)_(?<hour>\d\d)(?<minute>\d\d)(?<second>\d\d).*
    - VID_(?<year>\d\d\d\d)(?<month>\d\d)(?<day>\d\d)_(?<hour>\d\d)(?<minute>\d\d)(?<second>\d\d).*
    - WhatsApp Image (?<year>\d\d\d\d)-(?<month>\d\d)-(?<day>\d\d) at (?<hour>\d\d)\.(?<minute>\d\d)\.(?<second>\d\d).*
    - WhatsApp Video (?<year>\d\d\d\d)-(?<month>\d\d)-(?<day>\d\d) at (?<hour>\d\d)\.(?<minute>\d\d)\.(?<second>\d\d).*
  
  # A list of regex patterns used to exclude files from processing
  ExcludePatterns:
    - WP_\d\d\d\d\d\d.jpg